[pytest]
testpaths = tests
pythonpath = src .
addopts = -ra --strict-markers -p vibespace_model.pytest_openmp
markers =
    integration: end-to-end runs on fixture data (slower)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
    ignore::optuna.exceptions.ExperimentalWarning
