[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibespace-model"
version = "0.3.0"
description = "VibeSpace Movie DNA predictor: training, tuning, explainability and bias checks"
requires-python = ">=3.11,<3.12"
authors = [{ name = "VibeSpace team" }]

[project.scripts]
vibespace-model = "vibespace_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/vibespace_model"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
