# Fast checks for the Movie DNA model pipeline: lint + full offline test suite with coverage.
# No Google Cloud access and no secrets.
name: model-ci

on:
  pull_request:
    paths:
      - "Model-Pipeline/**"
      - ".github/workflows/model-ci.yml"
  push:
    paths:
      - "Model-Pipeline/**"
      - ".github/workflows/model-ci.yml"

permissions:
  contents: read

concurrency:
  group: model-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: Model-Pipeline
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Model-Pipeline/requirements.txt
            Model-Pipeline/requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # CPU-only PyTorch wheel first (same version as requirements.txt, much smaller download)
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0"
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .

      - name: Tests with coverage (fail under 85%)
        run: |
          set -euo pipefail
          python -m pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: Model-Pipeline/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
